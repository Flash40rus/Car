            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: white;
        }

        /* Счетчик очков */
        #score {

            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
